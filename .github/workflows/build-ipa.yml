name: Build MConfPoC IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

      - name: Install tooling
        run: brew install xcodegen xcbeautify ffmpeg

      - name: Generate sample.mov
        run: |
          mkdir -p Resources
          ffmpeg -y -f lavfi -i testsrc=duration=2:size=320x240:rate=30 \
                 -f lavfi -i sine=frequency=440:duration=2 \
                 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest \
                 Resources/sample.mov
          ls -lh Resources/sample.mov

      - name: Generate Xcode project
        run: |
          mkdir -p Generated
          xcodegen generate --spec project.yml

      - name: Import signing assets
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT=$RUNNER_TEMP/cert.p12
          PP=$RUNNER_TEMP/pp.mobileprovision
          KC=$RUNNER_TEMP/sign.keychain-db
          echo -n "$P12_BASE64" | base64 --decode -o $CERT
          echo -n "$PROFILE_BASE64" | base64 --decode -o $PP
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KC
          security set-keychain-settings -lut 21600 $KC
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KC
          security import $CERT -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KC
          security list-keychain -d user -s $KC
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild -project MConfPoC.xcodeproj \
            -scheme MConfPoC \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $RUNNER_TEMP/MConfPoC.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            archive | xcbeautify

      - name: Export IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          sed -i '' "s/REPLACE_WITH_TEAM_ID/$APPLE_TEAM_ID/" ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/MConfPoC.xcarchive \
            -exportPath $RUNNER_TEMP/export \
            -exportOptionsPlist ExportOptions.plist | xcbeautify

      - name: Upload IPA
        uses: actions/upload-artifact@v6
        with:
          name: MConfPoC-IPA
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 7

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/sign.keychain-db || true
