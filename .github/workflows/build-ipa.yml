name: Build MConfPoC Unsigned IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

      - name: Install tooling
        run: brew install xcodegen xcbeautify ffmpeg

      - name: Generate sample.mov
        run: |
          mkdir -p Resources
          ffmpeg -y -f lavfi -i testsrc=duration=2:size=320x240:rate=30 \
                 -f lavfi -i sine=frequency=440:duration=2 \
                 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest \
                 Resources/sample.mov
          ls -lh Resources/sample.mov

      - name: Generate Xcode project
        run: |
          mkdir -p Generated
          xcodegen generate --spec project.yml

      - name: Build unsigned .app
        run: |
          set -euo pipefail
          xcodebuild -project MConfPoC.xcodeproj \
            -scheme MConfPoC \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            build | xcbeautify

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP=$(find "$RUNNER_TEMP/dd/Build/Products/Release-iphoneos" -maxdepth 1 -name "*.app" -type d | head -n1)
          [ -n "$APP" ] || { echo "❌ no .app found"; exit 1; }
          echo "App: $APP"

          STAGE="$RUNNER_TEMP/ipa"
          mkdir -p "$STAGE/Payload"
          cp -R "$APP" "$STAGE/Payload/"

          # sanity: no embedded signature should exist
          if [ -d "$STAGE/Payload/$(basename "$APP")/_CodeSignature" ]; then
            rm -rf "$STAGE/Payload/$(basename "$APP")/_CodeSignature"
          fi

          mkdir -p "$RUNNER_TEMP/export"
          ( cd "$STAGE" && zip -qry "$RUNNER_TEMP/export/MConfPoC-unsigned.ipa" Payload )
          ls -lh "$RUNNER_TEMP/export/MConfPoC-unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v6
        with:
          name: MConfPoC-unsigned-IPA
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 7